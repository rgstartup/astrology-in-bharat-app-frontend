packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  ngrok: true
  sharp: true
  unrs-resolver: true
  esbuild: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - core-js
  - core-js-pure
  - ngrok
  - sharp
  - unrs-resolver
  - esbuild
  - turbo
