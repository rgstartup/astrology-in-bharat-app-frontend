# Usage: make dev APP=client        (default APP is client)
#        make prod APP=admin
# Apps: client (3000), admin (3001), expert (3003), commerce (3004), agent (8000)
services:
  client:
    profiles: ["client-prod"]
    container_name: aib-frontend-client
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: http://localhost:6543/api/v1
        APP: client
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: apps/client/.env
        required: false
      - path: apps/client/.env.local
        required: false
    environment:
      - NODE_ENV=production
      - API_URL=http://aib-backend:6543/api/v1
      - NEXT_PUBLIC_API_URL=http://localhost:6543/api/v1
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - aib-network

  client-dev:
    profiles: ["client-dev"]
    container_name: aib-frontend-client-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        APP: client
    ports:
      - "3000:3000"
    env_file:
      - path: apps/client/.env
        required: false
      - path: apps/client/.env.local
        required: false
    environment:
      - NODE_ENV=development
      - API_URL=http://aib-backend-dev:6543/api/v1
      - NEXT_PUBLIC_API_URL=http://localhost:6543/api/v1
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/client/node_modules
      - /app/apps/client/.next
    command: ["pnpm", "--filter", "client", "dev"]
    networks:
      - aib-network

  admin:
    profiles: ["admin-prod"]
    container_name: aib-frontend-admin
